name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-tests:
    # The audio DSP (chirps, cross-correlation, onsets, click scheduling, ring buffer, clock)
    # built for the host and tested with GoogleTest (BSD-3-Clause).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install GoogleTest and Ninja
        run: sudo apt-get update -q && sudo apt-get install -y -q libgtest-dev ninja-build

      - name: Build and run the native tests
        run: |
          cmake -S audio/src/test/cpp -B build/native-tests -G Ninja
          cmake --build build/native-tests
          ctest --test-dir build/native-tests --output-on-failure --output-junit native-tests.xml

      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-tests-${{ github.run_number }}
          path: build/native-tests/native-tests.xml
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint, unit tests and debug APK
        # GITHUB_RUN_NUMBER becomes versionCode, and versionName = 0.<stage>.<run> (app/build.gradle.kts).
        run: ./gradlew lint testDebugUnitTest assembleDebug --stacktrace

      - name: Name the APK
        id: apk
        env:
          # For pull requests use the source branch, for pushes the pushed branch.
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          safe_branch="$(echo "$BRANCH" | tr '/\\:*?"<>|' '---------')"
          name="MusicReader-${safe_branch}-${GITHUB_RUN_NUMBER}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_number }}
          path: |
            **/build/reports/
            **/build/test-results/
            app/src/test/screenshots/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
